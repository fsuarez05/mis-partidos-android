plugins { id 'com.android.application' }

android {
    namespace 'uy.federico.mispartidos'
    compileSdk 35

    signingConfigs {
        stable {
            storeFile file(System.getenv('MISPARTIDOS_KEYSTORE_PATH') ?: 'missing-release-key.jks')
            storePassword System.getenv('MISPARTIDOS_STORE_PASSWORD')
            keyAlias System.getenv('MISPARTIDOS_KEY_ALIAS')
            keyPassword System.getenv('MISPARTIDOS_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'uy.federico.mispartidos'
        minSdk 26
        targetSdk 35
        versionCode 45
        versionName '0.9.31'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            debuggable false
            minifyEnabled false
        }
    }

}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.0'
}
